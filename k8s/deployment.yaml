apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock-deployment
  namespace: seclock-prod
  labels:
    app: seclock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seclock
  template:
    metadata:
      labels:
        app: seclock
    spec:
      serviceAccountName: seclock-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: seclock-api
          image: 017161968499.dkr.ecr.ap-south-1.amazonaws.com/seclock:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
